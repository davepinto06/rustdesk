name: Publish Windows build to R2

# Takes the RustDesk-win64 artifact from a windows-custom run (no rebuild), uploads it to R2 as
# RustDesk-win64.exe and updates the windows block in manifest.json, leaving the macOS entries
# untouched. Called by windows-custom.yml when its `publish` input is set, or run by hand to
# publish (or roll back to) an earlier build.
#
# Version and source links come from the build-info.json inside the artifact, so they always
# describe the code that was actually built. Runs from before build-info.json existed cannot be
# published.
#
# manifest.json is also written by rustdesk-portal's mirror-macos.yml, in another repository, so a
# concurrency group cannot serialise the two. The manifest is written with a conditional PUT
# (If-Match on the ETag that was read) and retried if the other writer got there first.

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: "Actions run id to publish (blank = latest successful windows-custom run)"
        default: ""
  workflow_call:
    inputs:
      run-id:
        description: Actions run id whose RustDesk-win64 artifact to publish
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: r2-manifest-writers
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'rustdesk-dl' }}
      ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BASE_URL: https://dl.davepinto.dev
    steps:
      - name: Resolve run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run-id }}
        run: |
          set -euo pipefail
          run_id="$INPUT_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow windows-custom.yml \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$run_id" || { echo "::error::no successful windows-custom run found"; exit 1; }
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "Publishing run $run_id"

      - name: Download built artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: RustDesk-win64
          # Without a token the action reads the current run, which is what a call from
          # windows-custom wants; a token switches it to the API lookup for another run.
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ env.RUN_ID != github.run_id && github.token || '' }}
          path: dist

      - name: Read build info and checksum
        run: |
          set -euo pipefail
          ls -l dist
          test -s dist/RustDesk-win64.exe
          if [ ! -s dist/build-info.json ]; then
            echo "::error::run $RUN_ID has no build-info.json (built before it was added); rebuild instead"
            exit 1
          fi
          cat dist/build-info.json
          version=$(jq -r '.version // empty' dist/build-info.json)
          test -n "$version" || { echo "::error::build-info.json has no version"; exit 1; }
          size=$(stat -c%s dist/RustDesk-win64.exe)
          sha=$(sha256sum dist/RustDesk-win64.exe | cut -d' ' -f1)
          {
            echo "VERSION=$version"
            echo "SIZE=$size"
            echo "SHA256=$sha"
            echo "RELEASED=$(date -u +%F)"
          } >> "$GITHUB_ENV"
          echo "RustDesk-win64.exe $version: $size bytes, sha256 $sha"

      - name: Upload binary to R2
        run: |
          set -euo pipefail
          aws s3 cp dist/RustDesk-win64.exe "s3://$R2_BUCKET_NAME/RustDesk-win64.exe" \
            --endpoint-url "$ENDPOINT_URL" --only-show-errors \
            --content-type application/vnd.microsoft.portable-executable \
            --cache-control "public, max-age=600, must-revalidate"

      - name: Update manifest.json in R2
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            rm -f manifest.json
            if aws s3api get-object --bucket "$R2_BUCKET_NAME" --key manifest.json \
                 --endpoint-url "$ENDPOINT_URL" manifest.json > head.json 2>/dev/null; then
              etag=$(jq -r '.ETag' head.json)
              condition=(--if-match "$etag")
              echo "fetched manifest (etag $etag)"
            else
              echo '{"version":"","released":"","windows":{},"mac_arm64":{},"mac_intel":{}}' > manifest.json
              condition=(--if-none-match '*')
              echo "no manifest yet, creating one"
            fi

            jq \
              --arg url "$BASE_URL/RustDesk-win64.exe" \
              --argjson size "$SIZE" \
              --arg sha "$SHA256" \
              --arg released "$RELEASED" \
              --slurpfile info dist/build-info.json \
              '
              ($info[0]) as $b
              | .released = $released
              | .windows = {
                  url: $url,
                  size: $size,
                  sha256: $sha,
                  version: $b.version,
                  upstream_tag: $b.upstream_ref,
                  upstream_commit: $b.upstream_commit,
                  source_url: ("https://github.com/" + $b.upstream_repo + "/tree/" + $b.upstream_commit),
                  patch_url: ("https://github.com/" + $b.fork_repo + "/tree/" + $b.fork_commit + "/.github/custom"),
                  build_url: $b.run_url
                }
              ' manifest.json > manifest.new
            cat manifest.new

            if err=$(aws s3api put-object --bucket "$R2_BUCKET_NAME" --key manifest.json \
                  --endpoint-url "$ENDPOINT_URL" --body manifest.new \
                  --content-type application/json \
                  --cache-control "no-cache, no-store, must-revalidate" \
                  "${condition[@]}" 2>&1 >/dev/null); then
              echo "manifest.json updated"
              exit 0
            fi
            if grep -qE 'PreconditionFailed|412' <<<"$err"; then
              echo "manifest.json changed while updating it (attempt $attempt); retrying"
              sleep $((attempt * 3))
              continue
            fi
            echo "::error::manifest upload failed: $err"
            exit 1
          done
          echo "::error::gave up updating manifest.json after 5 conflicting attempts"
          exit 1

      - name: Summary
        run: |
          {
            echo "### Windows client published"
            echo ""
            echo "- binary: $BASE_URL/RustDesk-win64.exe ($SIZE bytes)"
            echo "- sha256: \`$SHA256\`"
            echo "- version: $VERSION (from run $RUN_ID)"
            echo "- manifest: $BASE_URL/manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"
