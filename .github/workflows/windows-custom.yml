name: Build custom Windows client

# Builds the Windows x64 PORTABLE client from upstream rustdesk/rustdesk with the self-hosted
# server baked in. Portable = single self-extracting exe, no installation, no service.
#
# Source code always comes from upstream rustdesk/rustdesk, never from this fork: the fork only
# carries these workflows and .github/custom/, so it never needs syncing with upstream.
#
#   source_ref: upstream tag, branch or commit to build. Blank = latest upstream release, the
#               same one the macOS mirror (rustdesk-portal/mirror-macos.yml) publishes.
#   publish:    after building, upload to R2 and update manifest.json via publish-windows.yml.
#
# The RustDesk-win64 artifact holds RustDesk-win64.exe plus build-info.json, which records
# exactly what was built. publish-windows.yml reads the version and source links from it.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Upstream tag, branch or commit to build (blank = latest release)
        default: ""
      publish:
        description: Publish to R2 and update manifest.json
        type: boolean
        default: false
      upload-unpacked:
        description: Also upload the unpacked build folder (debugging only)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  # Compared against upstream's flutter-build.yml by .github/custom/check_pins.py.
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  resolve:
    name: Resolve source, check patch and pins
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      commit: ${{ steps.ref.outputs.commit }}
      version: ${{ steps.pins.outputs.version }}
      vcpkg: ${{ steps.pins.outputs.vcpkg }}
    steps:
      - name: Resolve upstream ref to a commit
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          ref="$INPUT_REF"
          if [ -z "$ref" ]; then
            ref=$(gh api repos/rustdesk/rustdesk/releases/latest --jq .tag_name)
            echo "No source_ref given; using latest upstream release $ref"
          fi
          commit=$(gh api "repos/rustdesk/rustdesk/commits/$ref" --jq .sha)
          test -n "$commit" || { echo "::error::cannot resolve '$ref' in rustdesk/rustdesk"; exit 1; }
          { echo "ref=$ref"; echo "commit=$commit"; } >> "$GITHUB_OUTPUT"
          echo "Building rustdesk/rustdesk $ref at $commit"

      - name: Checkout upstream source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ steps.ref.outputs.commit }}
          submodules: recursive

      - name: Checkout CI helpers
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: |
            .github/custom
            .github/workflows
          sparse-checkout-cone-mode: false

      - name: Apply custom server patch
        run: |
          set -euo pipefail
          python3 .ci/.github/custom/apply_custom.py
          grep -nE 'RENDEZVOUS_SERVERS: &|RS_PUB_KEY: &' libs/hbb_common/src/config.rs

      - name: Check tool pins
        id: pins
        run: python3 .ci/.github/custom/check_pins.py

  generate-bridge:
    needs: resolve
    uses: ./.github/workflows/bridge-custom.yml
    with:
      source_commit: ${{ needs.resolve.outputs.commit }}

  build-RustDeskTempTopMostWindow:
    needs: resolve
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    name: Windows x64 (custom server)
    needs:
      - resolve
      - generate-bridge
      - build-RustDeskTempTopMostWindow
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_REF: ${{ needs.resolve.outputs.ref }}
      SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout upstream source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.SOURCE_COMMIT }}
          submodules: recursive

      - name: Checkout CI helpers (from the commit running this workflow)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: .ci
          sparse-checkout: .github/custom
          sparse-checkout-cone-mode: false

      - name: Apply custom server patch
        shell: bash
        run: python3 .ci/.github/custom/apply_custom.py

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ needs.resolve.outputs.vcpkg }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            # Check and move the files
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: topmostwindow-artifacts-x64
          path: ./rustdesk

      - name: Upload unpacked build (debug)
        if: inputs.upload-unpacked
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-unsigned-windows-x86_64
          path: rustdesk

      - name: Build self-extracted executable
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./dist
          mv ./target/release/rustdesk-portable-packer.exe ./dist/RustDesk-win64.exe

      - name: Write build-info.json
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, os
          info = {
              "version": os.environ["VERSION"],
              "upstream_repo": "rustdesk/rustdesk",
              "upstream_ref": os.environ["SOURCE_REF"],
              "upstream_commit": os.environ["SOURCE_COMMIT"],
              "fork_repo": os.environ["GITHUB_REPOSITORY"],
              "fork_commit": os.environ["GITHUB_SHA"],
              "run_url": os.environ["RUN_URL"],
          }
          with open("dist/build-info.json", "w") as f:
              json.dump(info, f, indent=2)
              f.write("\n")
          print(json.dumps(info, indent=2))
          EOF
          sha256sum dist/RustDesk-win64.exe
          ls -l dist

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: RustDesk-win64
          path: |
            dist/RustDesk-win64.exe
            dist/build-info.json
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: build-windows
    uses: ./.github/workflows/publish-windows.yml
    with:
      run-id: ${{ github.run_id }}
    secrets: inherit
